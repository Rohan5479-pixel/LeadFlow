{% extends 'base.html' %}

{% block page_title %}
Add Certification
{% endblock %}

{% block content %}

<div class="content-card">

    <h3>Add Certification</h3>

    <br>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">

            Save Certification

        </button>

        <a href="{% url 'certification_list' %}" class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
