{% extends 'base.html' %}

{% block page_title %}
Add Trainer
{% endblock %}

{% block content %}

<div class="content-card">

    <div class="card-title-row">
        <div>
            <h3>Add New Trainer</h3>
            <p class="text-muted mb-0">
                Enter the trainer details below.
            </p>
        </div>

        <a href="{% url 'trainer_list' %}" class="btn btn-secondary">
            ← Back
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="row">

            {% for field in form %}

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {{ field.errors }}
                    </div>
                {% endif %}

            </div>

            {% endfor %}

        </div>

        <div class="mt-3">

            <button type="submit" class="btn btn-primary">
                Save Trainer
            </button>

            <a href="{% url 'trainer_list' %}"
               class="btn btn-secondary ms-2">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
