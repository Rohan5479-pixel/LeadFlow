{% extends 'base.html' %}

{% block content %}
<div class="content-card">
    <h3>Add Counselor</h3>
    <hr>

    <form method="POST">
        {% csrf_token %}
        <div class="row">
            {% for field in form %}
            <div class="col-md-6 mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                <div class="text-danger">{{ field.errors }}</div>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Save Counselor</button>
        <a href="{% url 'counselor_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
