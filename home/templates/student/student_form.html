{% extends 'base.html' %}

{% block content %}

<div class="content-card">

    <h3 class="mb-4">Add Student</h3>

    <form method="POST">

        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Lead</label>
                {{ form.lead }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Student Name</label>
                {{ form.name }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                {{ form.email_id }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Contact Number</label>
                {{ form.contact_number }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Course</label>
                {{ form.course }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Batch</label>
                {{ form.batch }}
            </div>

            <div class="col-md-6 mb-3">
                <label>Admission Date</label>
                {{ form.admission_date }}
            </div>

        </div>

        <button type="submit" class="btn btn-success">
            Save Student
        </button>

        <a href="{% url 'student_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const lead = document.getElementById("id_lead");

    lead.addEventListener("change", function () {

        fetch(`/get-lead-details/?lead_id=${this.value}`)

        .then(response => response.json())

        .then(data => {

            document.getElementById("id_name").value = data.name || "";
            document.getElementById("id_email_id").value = data.email || "";
            document.getElementById("id_contact_number").value = data.contact || "";

            const course = document.getElementById("id_course");

            for (let i = 0; i < course.options.length; i++) {

                if (course.options[i].text.trim() === data.course) {
                    course.selectedIndex = i;
                    break;
                }

            }

        });

    });

});

</script>

{% endblock %}
