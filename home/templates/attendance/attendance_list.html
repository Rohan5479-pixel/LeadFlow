{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        Attendance List
    </h2>


    <a href="{% url 'attendance_add' %}" 
       class="btn btn-primary mb-3">
        Add Attendance
    </a>


    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>Student</th>
                <th>Batch</th>
                <th>Date</th>
                <th>Status</th>
            </tr>

        </thead>


        <tbody>

        {% for item in attendance %}

            <tr>

                <td>
                    {{item.student.name}}
                </td>


                <td>
                    {{item.batch.batch_name}}
                </td>


                <td>
                    {{item.date}}
                </td>


                <td>
                    {{item.status}}
                </td>

            </tr>


        {% empty %}

            <tr>
                <td colspan="4" class="text-center">
                    No Attendance Found
                </td>
            </tr>


        {% endfor %}


        </tbody>


    </table>


</div>


{% endblock %}
