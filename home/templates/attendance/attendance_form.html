{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        Add Attendance
    </h2>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit" class="btn btn-primary">
            Save Attendance
        </button>


        <a href="{% url 'attendance_list' %}" 
           class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
