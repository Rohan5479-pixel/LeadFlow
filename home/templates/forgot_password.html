<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#4f8dfd,#7a5cff);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,sans-serif;
        }

        .card{
            width:430px;
            border:none;
            border-radius:20px;
            overflow:hidden;
        }

        .card-header{
            background:#0d6efd;
            color:white;
            text-align:center;
            font-size:30px;
            font-weight:bold;
            padding:20px;
        }

        .card-body{
            padding:30px;
        }

        .btn-primary{
            width:100%;
            height:50px;
            font-size:18px;
        }

        .input-group-text{
            background:#0d6efd;
            color:white;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="card shadow-lg">

    <div class="card-header">
        <i class="bi bi-envelope-lock-fill"></i><br>
        Forgot Password
    </div>

    <div class="card-body">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label class="mb-2">
                Registered Email
            </label>

            <div class="input-group mb-4">

                <span class="input-group-text">
                    <i class="bi bi-envelope-fill"></i>
                </span>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Registered Email"
                    required>

            </div>

            <button class="btn btn-primary">
                <i class="bi bi-send-fill"></i>
                Send OTP
            </button>

        </form>

        <hr>

        <div class="text-center">

            <a href="{% url 'login' %}">
                <i class="bi bi-arrow-left-circle"></i>
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
